<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>トドリスト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f0f7ff;
            --main: #ffffff;
            --accent: #0ea5e9; /* 清潔感のある水色 */
            --text-dark: #1e293b;
            --text-light: #94a3b8;
            --success: #0ea5e9;
            --nav-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
        }

        .page { display: none; flex-direction: column; flex: 1; }
        .page.active { display: flex; }

        header {
            background: var(--main);
            padding: 20px;
            padding-top: env(safe-area-inset-top, 20px);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #e2eef9;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .progress-container {
            background: #e2eef9;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-bar {
            background: var(--accent);
            width: 0%;
            height: 100%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-area {
            padding: 15px 20px;
            background: var(--main);
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        input {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #e2eef9;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            background: white;
        }

        .add-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 16px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tabs {
            display: flex;
            padding: 12px 20px;
            gap: 25px;
            background: var(--bg);
        }

        .tab {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-light);
            cursor: pointer;
            padding-bottom: 4px;
            transition: 0.2s;
        }

        .tab.active {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        #task-list {
            padding: 10px 20px;
        }

        .task-item {
            background: var(--main);
            margin-bottom: 12px;
            padding: 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .checkbox {
            width: 28px;
            height: 28px;
            border: 2.5px solid #cbd5e1;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .task-item.done .checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .task-item.done .checkbox::after {
            content: '\f00c';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: white;
            font-size: 0.9rem;
        }

        .task-text { flex: 1; font-weight: 600; color: #334155; }
        .task-item.done .task-text { text-decoration: line-through; color: var(--text-light); }

        .del-btn { background: none; border: none; color: #cbd5e1; padding: 5px; cursor: pointer; transition: 0.2s; }
        .del-btn:hover { color: #f87171; }

        /* ボトムナビ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid #f1f5f9;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        .nav-item i { font-size: 1.4rem; transition: 0.2s; }
        .nav-item.active { color: var(--accent); }
        .nav-item.active i { transform: translateY(-2px); }

        .placeholder-content { padding: 100px 20px; text-align: center; color: var(--text-light); }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="home" class="page active">
        <header>
            <div class="header-top">
                <div class="logo-text">トドリスト</div>
                <span id="task-count" style="font-size: 0.9rem; font-weight: 900; color: var(--accent);">0%</span>
            </div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </header>

        <div class="input-area">
            <input type="text" id="task-input" placeholder="なにをする？" autocomplete="off">
            <button class="add-btn" id="add-btn"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="filterTasks('all', event)">すべて</div>
            <div class="tab" onclick="filterTasks('active', event)">未完了</div>
            <div class="tab" onclick="filterTasks('done', event)">完了</div>
        </div>

        <div id="task-list"></div>
    </div>

    <div id="calendar" class="page">
        <header><div class="logo-text">トドリスト</div></header>
        <div class="placeholder-content">
            <i class="fa-solid fa-calendar-days fa-4x" style="color: #e2eef9; margin-bottom: 20px;"></i>
            <p>カレンダー機能は準備中です</p>
        </div>
    </div>

    <div id="settings" class="page">
        <header><div class="logo-text">トドリスト</div></header>
        <div class="placeholder-content">
            <i class="fa-solid fa-gear fa-4x" style="color: #e2eef9; margin-bottom: 20px;"></i>
            <p>設定画面は準備中です</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('home', event)">
            <i class="fa-solid fa-house-user"></i>
            <span>ホーム</span>
        </div>
        <div class="nav-item" onclick="switchPage('calendar', event)">
            <i class="fa-solid fa-calendar-check"></i>
            <span>予定</span>
        </div>
        <div class="nav-item" onclick="switchPage('settings', event)">
            <i class="fa-solid fa-sliders"></i>
            <span>設定</span>
        </div>
    </nav>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('todo_list_data')) || [];
    let currentFilter = 'all';

    const input = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const listElement = document.getElementById('task-list');

    function switchPage(pageId, event) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function save() {
        localStorage.setItem('todo_list_data', JSON.stringify(tasks));
        render();
    }

    function addTask() {
        if (!input.value.trim()) return;
        tasks.unshift({ id: Date.now(), text: input.value, done: false });
        input.value = '';
        save();
    }

    function toggleTask(id) {
        tasks = tasks.map(t => t.id === id ? {...t, done: !t.done} : t);
        save();
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        save();
    }

    function filterTasks(type, event) {
        currentFilter = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        render();
    }

    function render() {
        listElement.innerHTML = '';
        const filtered = tasks.filter(t => {
            if (currentFilter === 'active') return !t.done;
            if (currentFilter === 'done') return t.done;
            return true;
        });

        filtered.forEach(task => {
            const div = document.createElement('div');
            div.className = `task-item ${task.done ? 'done' : ''}`;
            div.innerHTML = `
                <div class="checkbox" onclick="toggleTask(${task.id})"></div>
                <div class="task-text">${task.text}</div>
                <button class="del-btn" onclick="deleteTask(${task.id})"><i class="fa-solid fa-trash-can"></i></button>
            `;
            listElement.appendChild(div);
        });

        const doneCount = tasks.filter(t => t.done).length;
        const percent = tasks.length > 0 ? Math.round((doneCount / tasks.length) * 100) : 0;
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('task-count').innerText = percent + '%';
    }

    addBtn.onclick = addTask;
    input.onkeypress = (e) => { if(e.key === 'Enter') addTask(); };

    render();
</script>

</body>
</html>
