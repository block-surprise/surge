<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>トドリスト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f0f7ff;
            --main: #ffffff;
            --accent: #0ea5e9;
            --text-dark: #1e293b;
            --text-light: #94a3b8;
            --success: #0ea5e9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
        }

        header {
            background: var(--main);
            padding: 20px;
            padding-top: env(safe-area-inset-top, 20px);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #e2eef9;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo-text { font-size: 1.5rem; font-weight: 900; color: var(--accent); }

        /* 共有ボタンのデザイン */
        .share-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.2);
        }

        .progress-container { background: #e2eef9; height: 8px; border-radius: 10px; overflow: hidden; }
        #progress-bar { background: var(--accent); width: 0%; height: 100%; transition: width 0.5s ease; }

        .input-area { padding: 15px 20px; background: var(--main); display: flex; gap: 12px; }
        input { flex: 1; background: #f8fafc; border: 1px solid #e2eef9; padding: 12px 18px; border-radius: 16px; font-size: 1rem; outline: none; }
        .add-btn { background: var(--accent); color: white; border: none; width: 50px; height: 50px; border-radius: 16px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        #task-list { padding: 20px; }
        .task-item {
            background: var(--main);
            margin-bottom: 12px;
            padding: 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .checkbox { width: 26px; height: 26px; border: 2.5px solid #cbd5e1; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .task-item.done .checkbox { background: var(--success); border-color: var(--success); }
        .task-item.done .checkbox::after { content: '\f00c'; font-family: "Font Awesome 6 Free"; font-weight: 900; color: white; font-size: 0.8rem; }

        .task-text { flex: 1; font-weight: 600; color: #334155; }
        .task-item.done .task-text { text-decoration: line-through; color: var(--text-light); }

        .del-btn { background: none; border: none; color: #cbd5e1; padding: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-top">
            <div class="logo-text">トドリスト</div>
            <button class="share-btn" onclick="generateShareLink()">
                <i class="fa-solid fa-share-nodes"></i> リストを共有
            </button>
        </div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </header>

    <div class="input-area">
        <input type="text" id="task-input" placeholder="なにをする？" autocomplete="off">
        <button class="add-btn" id="add-btn"><i class="fa-solid fa-plus"></i></button>
    </div>

    <div id="task-list"></div>
</div>

<script>
    let tasks = [];

    const input = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const listElement = document.getElementById('task-list');

    // --- URLからデータを読み込む機能 ---
    function loadFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const encodedData = params.get('data');
        
        if (encodedData) {
            try {
                // URLから受け取ったデータをデコードしてタスクに入れる
                const decodedTasks = JSON.parse(decodeURIComponent(atob(encodedData)));
                // 既存のデータと合体させるか、上書きするか選べますが、今回は「共有されたものを表示」を優先
                if (confirm("共有されたリストを読み込みますか？（今のリストは上書きされます）")) {
                    tasks = decodedTasks;
                    save();
                }
            } catch (e) {
                console.error("データの読み込みに失敗しました");
            }
        } else {
            // URLにデータがない場合はいつものローカルストレージから読み込む
            tasks = JSON.parse(localStorage.getItem('todo_list_data')) || [];
        }
    }

    // --- 共有リンクを生成する機能 ---
    async function generateShareLink() {
        if (tasks.length === 0) {
            alert("共有するタスクがありません！");
            return;
        }

        // データを圧縮・エンコード
        const jsonStr = JSON.stringify(tasks);
        const encodedData = btoa(encodeURIComponent(jsonStr));
        
        // 今のURLの末尾にデータをつけてリンクを作成
        const shareUrl = `${window.location.origin}${window.location.pathname}?data=${encodedData}`;

        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'トドリストの共有',
                    text: '私のタスクリストを見てね！',
                    url: shareUrl
                });
            } catch (err) { console.log('キャンセル'); }
        } else {
            // PCなどの場合はクリップボードにコピー
            await navigator.clipboard.writeText(shareUrl);
            alert("共有リンクをコピーしました！");
        }
    }

    function save() {
        localStorage.setItem('todo_list_data', JSON.stringify(tasks));
        render();
    }

    function addTask() {
        if (!input.value.trim()) return;
        tasks.unshift({ id: Date.now(), text: input.value, done: false });
        input.value = '';
        save();
    }

    function toggleTask(id) {
        tasks = tasks.map(t => t.id === id ? {...t, done: !t.done} : t);
        save();
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        save();
    }

    function render() {
        listElement.innerHTML = '';
        tasks.forEach(task => {
            const div = document.createElement('div');
            div.className = `task-item ${task.done ? 'done' : ''}`;
            div.innerHTML = `
                <div class="checkbox" onclick="toggleTask(${task.id})"></div>
                <div class="task-text">${task.text}</div>
                <button class="del-btn" onclick="deleteTask(${task.id})"><i class="fa-solid fa-trash-can"></i></button>
            `;
            listElement.appendChild(div);
        });

        const doneCount = tasks.filter(t => t.done).length;
        const percent = tasks.length > 0 ? Math.round((doneCount / tasks.length) * 100) : 0;
        document.getElementById('progress-bar').style.width = percent + '%';
    }

    addBtn.onclick = addTask;
    input.onkeypress = (e) => { if(e.key === 'Enter') addTask(); };

    // 起動時にURLをチェック
    loadFromUrl();
    render();
</script>
</body>
</html>
