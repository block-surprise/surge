<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURGE PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f8f9fa;
            --main: #ffffff;
            --accent: #4f46e5;
            --text-dark: #1e293b;
            --text-light: #94a3b8;
            --success: #10b981;
            --nav-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 80px; /* ナビバーの高さ分確保 */
        }

        /* 画面セクションの切り替え */
        .page { display: none; flex-direction: column; flex: 1; }
        .page.active { display: flex; }

        header {
            background: var(--main);
            padding: 20px;
            padding-top: env(safe-area-inset-top, 20px);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #eee;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 { font-size: 1.4rem; font-weight: 800; color: var(--accent); }

        .progress-container {
            background: #e2e8f0;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-bar {
            background: var(--accent);
            width: 0%;
            height: 100%;
            transition: width 0.4s ease;
        }

        .input-area {
            padding: 15px 20px;
            background: var(--main);
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #f1f5f9;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        .add-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 45px;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            padding: 10px 20px;
            gap: 20px;
            background: var(--bg);
        }

        .tab {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-light);
            cursor: pointer;
            padding-bottom: 4px;
        }

        .tab.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        #task-list {
            padding: 10px 20px;
        }

        .task-item {
            background: var(--main);
            margin-bottom: 12px;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .task-item.done .checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .task-item.done .checkbox::after {
            content: '\f00c';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: white;
            font-size: 0.7rem;
        }

        .task-text { flex: 1; font-weight: 500; }
        .task-item.done .task-text { text-decoration: line-through; color: var(--text-light); }

        .del-btn { background: none; border: none; color: #fca5a5; padding: 5px; cursor: pointer; }

        /* ボトムナビゲーションバー */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid #eee;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        .nav-item i { font-size: 1.2rem; }
        .nav-item.active { color: var(--accent); }

        /* 他のページ用の一時的なメッセージ */
        .placeholder-content {
            padding: 50px 20px;
            text-align: center;
            color: var(--text-light);
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="home" class="page active">
        <header>
            <div class="header-top">
                <h1>SURGE PRO</h1>
                <span id="task-count" style="font-size: 0.8rem; font-weight: bold;">0% 完了</span>
            </div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </header>

        <div class="input-area">
            <input type="text" id="task-input" placeholder="タスクを追加..." autocomplete="off">
            <button class="add-btn" id="add-btn"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="filterTasks('all', event)">すべて</div>
            <div class="tab" onclick="filterTasks('active', event)">未完了</div>
            <div class="tab" onclick="filterTasks('done', event)">完了済み</div>
        </div>

        <div id="task-list"></div>
    </div>

    <div id="calendar" class="page">
        <header><h1>カレンダー</h1></header>
        <div class="placeholder-content">
            <i class="fa-regular fa-calendar-days fa-3x"></i>
            <p style="margin-top:15px;">カレンダー機能は準備中です</p>
        </div>
    </div>

    <div id="settings" class="page">
        <header><h1>設定</h1></header>
        <div class="placeholder-content">
            <i class="fa-solid fa-gear fa-3x"></i>
            <p style="margin-top:15px;">設定画面は準備中です</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('home', event)">
            <i class="fa-solid fa-house"></i>
            <span>ホーム</span>
        </div>
        <div class="nav-item" onclick="switchPage('calendar', event)">
            <i class="fa-solid fa-calendar-days"></i>
            <span>カレンダー</span>
        </div>
        <div class="nav-item" onclick="switchPage('gear', event)"> <i class="fa-solid fa-sliders"></i>
            <span>設定</span>
        </div>
    </nav>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('surge_tasks')) || [];
    let currentFilter = 'all';

    const input = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const listElement = document.getElementById('task-list');

    // ページ切り替え
    function switchPage(pageId, event) {
        // ナビの見た目切り替え
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');

        // 表示エリアの切り替え
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        
        // 設定ボタンなどのID調整
        if(pageId === 'gear') pageId = 'settings';
        document.getElementById(pageId).classList.add('active');
    }

    function save() {
        localStorage.setItem('surge_tasks', JSON.stringify(tasks));
        render();
    }

    function addTask() {
        if (!input.value.trim()) return;
        tasks.unshift({ id: Date.now(), text: input.value, done: false });
        input.value = '';
        save();
    }

    function toggleTask(id) {
        tasks = tasks.map(t => t.id === id ? {...t, done: !t.done} : t);
        save();
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        save();
    }

    function filterTasks(type, event) {
        currentFilter = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        render();
    }

    function render() {
        listElement.innerHTML = '';
        const filtered = tasks.filter(t => {
            if (currentFilter === 'active') return !t.done;
            if (currentFilter === 'done') return t.done;
            return true;
        });

        filtered.forEach(task => {
            const div = document.createElement('div');
            div.className = `task-item ${task.done ? 'done' : ''}`;
            div.innerHTML = `
                <div class="checkbox" onclick="toggleTask(${task.id})"></div>
                <div class="task-text">${task.text}</div>
                <button class="del-btn" onclick="deleteTask(${task.id})"><i class="fa-solid fa-trash-can"></i></button>
            `;
            listElement.appendChild(div);
        });

        const doneCount = tasks.filter(t => t.done).length;
        const percent = tasks.length > 0 ? Math.round((doneCount / tasks.length) * 100) : 0;
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('task-count').innerText = percent + '% 完了';
    }

    addBtn.onclick = addTask;
    input.onkeypress = (e) => { if(e.key === 'Enter') addTask(); };

    render();
</script>

</body>
</html>
